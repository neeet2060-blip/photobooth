<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 2400" width="2400" height="2400">
  <defs>
    <radialGradient id="s02-beamL" cx="0" cy="0" r="1.4" gradientUnits="userSpaceOnUse" gradientTransform="translate(0,0)">
      <stop offset="0%" stop-color="#ff2fd0" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#ff2fd0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff2fd0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s02-beamR" cx="0" cy="0" r="1.4" gradientUnits="userSpaceOnUse" gradientTransform="translate(2400,0)">
      <stop offset="0%" stop-color="#2fd0ff" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#2fd0ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2fd0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s02-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2fd0"/>
      <stop offset="100%" stop-color="#2fd0ff"/>
    </linearGradient>
  </defs>

  <!-- True-black background, 4 slot windows knocked out -->
  <path fill-rule="evenodd" fill="#000004"
    d="M0,0 H2400 V2400 H0 Z
       M75,75 H1170 V1170 H75 Z
       M1230,75 H2325 V1170 H1230 Z
       M75,1230 H1170 V2325 H75 Z
       M1230,1230 H2325 V2325 H1230 Z"/>

  <!-- Neon spotlight glow beams, confined to the border/margin area -->
  <path fill="url(#s02-beamL)" fill-rule="evenodd"
    d="M0,0 H2400 V2400 H0 Z M75,75 H1170 V1170 H75 Z M1230,75 H2325 V1170 H1230 Z M75,1230 H1170 V2325 H75 Z M1230,1230 H2325 V2325 H1230 Z"/>
  <path fill="url(#s02-beamR)" fill-rule="evenodd"
    d="M0,0 H2400 V2400 H0 Z M75,75 H1170 V1170 H75 Z M1230,75 H2325 V1170 H1230 Z M75,1230 H1170 V2325 H75 Z M1230,1230 H2325 V2325 H1230 Z"/>

  <!-- Bold neon keylines, double-stroked for a glow feel without any blur bleed -->
  <g fill="none" stroke="url(#s02-edge)" stroke-width="10">
    <rect x="75" y="75" width="1095" height="1095"/>
    <rect x="1230" y="75" width="1095" height="1095"/>
    <rect x="75" y="1230" width="1095" height="1095"/>
    <rect x="1230" y="1230" width="1095" height="1095"/>
  </g>
  <g fill="none" stroke="url(#s02-edge)" stroke-width="2" opacity="0.55">
    <rect x="60" y="60" width="1125" height="1125"/>
    <rect x="1215" y="60" width="1125" height="1125"/>
    <rect x="60" y="1215" width="1125" height="1125"/>
    <rect x="1215" y="1215" width="1125" height="1125"/>
  </g>

  <!-- Center badge in the gap cross -->
  <circle cx="1200" cy="1200" r="70" fill="#000004" stroke="url(#s02-edge)" stroke-width="6"/>
  <text x="1200" y="1212" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="800" fill="#f4f0ff" letter-spacing="2">STAGE</text>

  <!-- Small corner accent stickers -->
  <circle cx="75" cy="75" r="18" fill="#ff2fd0"/>
  <circle cx="2325" cy="2325" r="18" fill="#2fd0ff"/>
  <circle cx="2325" cy="75" r="10" fill="#ff2fd0" opacity="0.8"/>
  <circle cx="75" cy="2325" r="10" fill="#2fd0ff" opacity="0.8"/>

  <!-- Top margin mark -->
  <text x="1200" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" letter-spacing="8" fill="#f4f0ff">TASTE OF KOREA</text>
</svg>
