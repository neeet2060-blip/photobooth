  <text x="60" y="50" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="38" font-weight="800" fill="#ffffff">한국의 맛</text>
  <text x="1140" y="50" text-anchor="end" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#ffffff">TASTE OF KOREA</text>

  <g fill="none" stroke="#1c1c1c" stroke-width="12">
