  <rect x="75" y="1742" width="1050" height="8" fill="url(#s09-red)"/>
  <rect x="75" y="2597" width="1050" height="8" fill="url(#s09-red)"/>

  <!-- Bold footer band: big Hangul typography as the design element, real branded footer -->
