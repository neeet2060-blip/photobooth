<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>카메라 - 인생네컷 포토부스</title>
  <link rel="stylesheet" href="/shared/app.css" />
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    #video-wrap { position: fixed; inset: 0; background: #000; }
    #video { width: 100%; height: 100%; object-fit: cover; }
    #video.mirror { transform: scaleX(-1); }
    #status-bar { position: fixed; top: 0; left: 0; right: 0; padding: 14px; text-align: center;
      background: rgba(0,0,0,0.5); color: #fff; font-size: 1rem; z-index: 50; }
    #start-overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 20px; background: rgba(0,0,0,0.85); z-index: 100; color: #fff; }
    #controls { position: fixed; bottom: 16px; right: 16px; z-index: 60; }
  </style>
</head>
<body>
  <div id="video-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="capture-canvas" style="display:none;"></canvas>
  </div>
  <div id="status-bar"></div>
  <div id="controls">
    <button id="mirror-btn"></button>
  </div>
  <div id="start-overlay">
    <div id="start-title"></div>
    <button id="start-btn" class="primary big-button"></button>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/camera/camera.js"></script>
</body>
</html>
